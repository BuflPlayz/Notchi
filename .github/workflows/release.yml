# Builds Notchi-<version>.dmg and publishes it as a GitHub release.
#
# Every push to main publishes a release. Its version is MARKETING_VERSION if
# that hasn't been released yet, otherwise the next patch after the latest
# release in that line (0.3.0, then 0.3.1, 0.3.2…). Bump MARKETING_VERSION for
# a new feature line; patches need no bump. The patch number is stamped into
# the build only, not committed back.
#
# Also: push a tag matching MARKETING_VERSION (git tag v0.3.0 && git push origin
# v0.3.0), or tap Run workflow in the Actions tab (works from a phone). Untick
# "Publish a release" there to only build a DMG you can download from the run's
# artifacts.
#
# Signing, best first:
# - Developer ID (and notarized): no warning on first launch. Needs the secrets
#   below.
# - Notchi's self-signed release certificate, from NOTCHI_SIGNING_P12 (.p12,
#   base64) and NOTCHI_SIGNING_P12_PASSWORD. People click "Open Anyway" in
#   System Settings › Privacy & Security on first launch, but every release is
#   the same app to macOS: permissions carry over and the in-app updater can
#   verify updates. Keep this certificate: releases signed with another one
#   lose both.
# - Neither: ad hoc, which loses permissions on every update.
# For Developer ID, add these repository secrets:
#   DEVELOPER_ID_P12           Developer ID Application certificate + key, .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  The .p12's password
#   NOTARY_KEY_P8              App Store Connect API key (.p8), base64
#   NOTARY_KEY_ID              That key's ID
#   NOTARY_ISSUER_ID           Its issuer ID
# (base64 -i file | pbcopy, then paste into Settings › Secrets and variables › Actions.)

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (the next unreleased version)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Choose the version
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          base="$(xcodebuild -project Notchi.xcodeproj -target Notchi -configuration Release -showBuildSettings \
            | awk '$1 == "MARKETING_VERSION" { print $3; exit }')"
          version="$base"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A pushed tag must match the app's version.
            if [[ "${GITHUB_REF_NAME#v}" != "$base" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $base. Bump the version or retag."
              exit 1
            fi
          elif [[ "$PUBLISH" == "true" ]]; then
            # Released already? Then this is the next patch in that line.
            git fetch --tags --force --quiet
            if git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
              IFS=. read -r major minor _ <<< "$base"
              last="$(git tag -l "v$major.$minor.*" | sed 's/^v//' | sort -t. -k3,3n | tail -1)"
              version="$major.$minor.$(( ${last##*.} + 1 ))"
            fi
          fi
          if [[ "$version" != "$base" ]]; then
            # Only the app's and tests' version lines carry $base; the bundled
            # MediaRemoteAdapter keeps its own.
            sed -i '' "s/MARKETING_VERSION = $base;/MARKETING_VERSION = $version;/" Notchi.xcodeproj/project.pbxproj
          fi
          echo "Building version $version (MARKETING_VERSION is $base)"

      - name: Set up signing
        id: signing
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SELF_P12: ${{ secrets.NOTCHI_SIGNING_P12 }}
          SELF_P12_PASSWORD: ${{ secrets.NOTCHI_SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$P12" && -n "$SELF_P12" ]]; then
            # Notchi's self-signed release certificate, in a throwaway keychain.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(uuidgen)"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            echo "$SELF_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$SELF_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            # Self-signed, so not "valid" (-v) to macOS; codesign uses it all the same.
            identity="$(security find-identity -p codesigning "$keychain" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
            [[ -n "$identity" ]] || { echo "::error::No signing identity in NOTCHI_SIGNING_P12"; exit 1; }
            echo "Signing with the self-signed certificate $identity"
            {
              echo "mode=self-signed"
              echo "identity=$identity"
              echo "notarized=false"
              echo "keychain=$keychain"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$P12" ]]; then
            echo "::warning::No signing certificate in secrets; signing ad hoc. Permissions won't carry over between updates."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "::error::No Developer ID Application identity in DEVELOPER_ID_P12"; exit 1; }
          team="$(sed -n 's/.*(\([A-Z0-9]*\))$/\1/p' <<< "$identity")"
          echo "Signing as $identity"
          notarize=false
          if [[ -n "$NOTARY_KEY_P8" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER_ID" ]]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials notchi-notary \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --keychain "$keychain"
            rm -f "$RUNNER_TEMP/notary.p8"
            notarize=true
          else
            echo "::warning::No notary API key in secrets; the DMG is signed but not notarized."
          fi
          {
            echo "mode=developer-id"
            echo "identity=$identity"
            echo "team=$team"
            echo "notarized=$notarize"
            echo "keychain=$keychain"
          } >> "$GITHUB_OUTPUT"

      - name: Build the DMG
        id: dmg
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          TEAM: ${{ steps.signing.outputs.team }}
          NOTARIZE: ${{ steps.signing.outputs.notarized }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          args=()
          if [[ "$MODE" == "developer-id" ]]; then
            args+=(--identity "$IDENTITY" --team "$TEAM")
            if [[ "$NOTARIZE" == "true" ]]; then
              args+=(--notarize notchi-notary --keychain "$KEYCHAIN")
            fi
          elif [[ "$MODE" == "self-signed" ]]; then
            args+=(--self-signed "$IDENTITY")
          else
            args+=(--adhoc)
          fi
          scripts/make-dmg.sh "${args[@]}"

      - name: Upload the DMG as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notchi-${{ steps.dmg.outputs.version }}
          path: ${{ steps.dmg.outputs.dmg }}
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          VERSION: ${{ steps.dmg.outputs.version }}
          NOTARIZED: ${{ steps.signing.outputs.notarized }}
        run: |
          # The version chosen above. Creating the release creates its tag at
          # this commit (a tag made with the workflow's token doesn't start
          # another run).
          tag="v$VERSION"

          {
            echo "Download **$(basename "$DMG")**, open it, and drag Notchi onto Applications."
            echo
            echo "Requires macOS 14 or later on Apple Silicon."
            if [[ "$NOTARIZED" != "true" ]]; then
              echo
              echo "This build isn't notarized. If macOS says it can't check Notchi for malicious software, open System Settings › Privacy & Security and click **Open Anyway**."
            fi
          } > "$RUNNER_TEMP/notes.md"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$DMG" --clobber
          else
            gh release create "$tag" "$DMG" \
              --target "$GITHUB_SHA" \
              --title "Notchi ${tag#v}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --generate-notes
          fi

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}"
